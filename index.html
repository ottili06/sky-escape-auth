
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sky Escape - Google Giriş</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }
    body {
      background: linear-gradient(150deg,#0a1634,#173b68);
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: white;
    }
    main {
      width: min(420px,calc(100% - 48px));
      padding: 30px 24px;
      background: #14254a;
      border: 1px solid #d5ad66;
      border-radius: 20px;
      text-align: center;
    }
    h1 { color: #f5d48c; letter-spacing: 2px; }
    button {
      background: #f2d48b;
      color: #182345;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
    }
    button:disabled { opacity: .5; }
    p { line-height: 1.6; }
    #status { color: #c9d8ef; }
    small { color: #a9bfdc; }
    #account { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>✦ SKY ESCAPE ✦</h1>
  <p>Google hesabıyla giriş</p>

  <button id="login" disabled>
    Google ile giriş yap
  </button>

  <button id="logout" hidden>
    Çıkış yap
  </button>

  <p id="status">Giriş sistemi hazırlanıyor...</p>
  <p id="account"></p>

  <button id="return" hidden>
    Oyuna bağlan
  </button>

  <small>
    Girişi oyun içinden başlat.
    Google hesabını doğruladıktan sonra
    Oyuna bağlan butonuna bas.
  </small>
</main>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';

  const SUPABASE_URL =
    'https://rlhzlxgysteubpjaksuk.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_wtyRI2jbCE9KDr5to94Bsg_myfg28NL';

  const params = new URLSearchParams(location.search);

  const challenge = params.get('state') || '';
  const openerOrigin = params.get('origin') || '';

  const allowedHosts = [
    'ottili.itch.io'
  ];

  const validOrigin = (() => {
    try {
      const url = new URL(openerOrigin);
      return url.protocol === 'https:' &&
        (allowedHosts.includes(url.hostname) ||
         url.hostname.endsWith('.itch.zone') ||
         url.hostname.endsWith('.itch.games'));
    } catch {
      return false;
    }
  })();

  const redirectTo =
    'https://ottili06.github.io/sky-escape-auth/' +
    (challenge && validOrigin
      ? '?state=' + encodeURIComponent(challenge) +
        '&origin=' + encodeURIComponent(openerOrigin)
      : '');

  const login = document.querySelector('#login');
  const logout = document.querySelector('#logout');
  const returnButton = document.querySelector('#return');
  const status = document.querySelector('#status');
  const account = document.querySelector('#account');

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        flowType: 'pkce',
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );

  let currentSession = null;

  function render(session) {
    currentSession = session;

    const user = session?.user;

    login.hidden = !!user;
    logout.hidden = !user;

    returnButton.hidden =
      !user || !validOrigin || !challenge;

    account.textContent = user
      ? 'Google profil adı: ' +
        (user.user_metadata?.full_name ||
         user.user_metadata?.name ||
         'Ad belirtilmemiş')
      : '';

    status.textContent = user
      ? 'Google girişi doğrulandı ✓'
      : 'Giriş yapmak için butona bas.';
  }

  login.addEventListener('click', async () => {
    login.disabled = true;

    status.textContent =
      'Google giriş sayfasına yönlendiriliyor...';

    const { error } =
      await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo }
      });

    if (error) {
      status.textContent = error.message;
      login.disabled = false;
    }
  });

  returnButton.addEventListener('click', () => {
    if (!currentSession ||
        !challenge ||
        !validOrigin ||
        !window.opener) {
      status.textContent =
        'Oyun bağlantısı bulunamadı. ' +
        'Girişi oyun içinden başlat.';
      return;
    }

    window.opener.postMessage({
      kind: 'sky-escape-auth-v1',
      state: challenge,
      access_token: currentSession.access_token,
      refresh_token: currentSession.refresh_token
    }, openerOrigin);

    status.textContent =
      'Bağlantı bilgisi gönderildi. ' +
      'Oyun sekmesine dön.';
  });

  logout.addEventListener('click', async () => {
    const { error } = await supabase.auth.signOut();

    if (error) {
      status.textContent = error.message;
    } else {
      render(null);
    }
  });

  supabase.auth.onAuthStateChange(
    (_event, session) => render(session)
  );

  const { data, error } =
    await supabase.auth.getSession();

  if (error) {
    status.textContent =
      'Oturum hatası: ' + error.message;
  } else {
    render(data.session);
  }

  login.disabled = false;
</script>
</body>
</html>
